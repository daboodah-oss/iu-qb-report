name: Update report

on:
  schedule:
    # Sunday and Wednesday 10:47 Eastern (cron is UTC; 14:47 UTC = 10:47 EDT, 9:47 EST)
    - cron: "47 14 * * 0,3"
    # backups in case GitHub skips a scheduled run (a run with no new data changes nothing)
    - cron: "47 16 * * 0,3"
    - cron: "47 20 * * 0,3"
  workflow_dispatch:
    inputs:
      save_raw:
        description: "Save raw source pages to raw/ (debugging)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect new data
        id: collect
        continue-on-error: true
        env:
          SAVE_RAW: ${{ inputs.save_raw && '1' || '' }}
        run: |
          mkdir -p logs
          set -o pipefail
          python collect.py 2>&1 | tee logs/collect.txt
      - name: Build page (validation must pass)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          python build_report.py --standalone --out index.html 2>&1 | tee logs/build.txt
      - name: Commit and push
        run: |
          git config user.name "iu-qb-report bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.build.outcome }}" = "success" ]; then git add -A data index.html; else git checkout -- data index.html 2>/dev/null || true; fi
          git add -f logs
          [ -d raw ] && git add -f raw || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update $(date -u +%F)"; git push; fi
      - name: Report problems
        if: steps.collect.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "collect=${{ steps.collect.outcome }} build=${{ steps.build.outcome }}; see logs/ in the repository"
          exit 1
